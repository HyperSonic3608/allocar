spring.application.name=backend
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
spring.sql.init.mode=never

allocar.database.project-ref=obohphyddhvddpqwrapx
allocar.database.url=${SUPABASE_DB_URL:}
allocar.database.username=${SUPABASE_DB_USERNAME:allocar_api}
allocar.database.password=${SUPABASE_DB_PASSWORD:}
allocar.database.maximum-pool-size=${SUPABASE_DB_POOL_SIZE:5}

allocar.api.allowed-origins=${ALLOCAR_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${ALLOCAR_COOKIE_SECURE:false}
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
